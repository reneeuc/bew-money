<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>終極清零 BeW Money</title>
<style>body{font-family:-apple-system;padding:40px;text-align:center}</style>
<h1>清緊...</h1>
<script>
(async()=>{
  // 1. 清 localStorage + sessionStorage
  localStorage.clear();
  sessionStorage.clear();
  // 2. 清 IndexedDB (BeW Money可能用呢個)
  if(window.indexedDB && indexedDB.databases){
    const dbs = await indexedDB.databases();
    for(const db of dbs){
      if(db.name) indexedDB.deleteDatabase(db.name);
    }
  }else{
    // 舊版手動試
    ['bew-money','BeW-Money','bewmoney','keyval-store'].forEach(n=>{
      try{indexedDB.deleteDatabase(n);}catch(e){}
    });
  }
  // 3. 清 Cache + Service Worker
  if('caches' in window){
    const keys = await caches.keys();
    for(const k of keys) await caches.delete(k);
  }
  if('serviceWorker' in navigator){
    const regs = await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
  }
  document.body.innerHTML='<h1>✅ 已全部清零！</h1><p>3秒後跳去乾淨版</p>';
  setTimeout(()=>location.replace('./BeW-Money.html?clean='+Date.now()),1500);
})();
</script>
